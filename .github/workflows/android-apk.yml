name: Build Android Debug APK

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
      - scanme-ai-android-ux
  pull_request:
    branches:
      - main
      - master
      - scanme-ai-android-ux
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK packages
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Create fresh Capacitor Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Install persistent ScanMe native camera bridge
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/martmartai/inventory
          cp native/android/ScanMeCameraPlugin.java android/app/src/main/java/com/martmartai/inventory/ScanMeCameraPlugin.java
          cp native/android/MainActivity.java android/app/src/main/java/com/martmartai/inventory/MainActivity.java

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "dependencies {"
          deps = """dependencies {
              implementation "androidx.camera:camera-core:1.4.1"
              implementation "androidx.camera:camera-camera2:1.4.1"
              implementation "androidx.camera:camera-lifecycle:1.4.1"
              implementation "androidx.camera:camera-view:1.4.1"
              implementation "androidx.lifecycle:lifecycle-runtime:2.8.7"
          """
          if marker not in s:
              raise SystemExit("dependencies block not found")
          s = s.replace(marker, deps, 1)
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          if permission not in s:
              s = s.replace("<manifest", "<manifest", 1)
              insert_at = s.find(">")
              s = s[:insert_at+1] + "\n    " + permission + s[insert_at+1:]
          feature = '<uses-feature android:name="android.hardware.camera.any" android:required="false" />'
          if feature not in s:
              insert_at = s.find(">")
              s = s[:insert_at+1] + "\n    " + feature + s[insert_at+1:]
          p.write_text(s)
          PY

      - name: Generate Android app icon and splash assets
        run: |
          npx @capacitor/assets generate --android --assetPath assets             --iconBackgroundColor '#092B4C'             --iconBackgroundColorDark '#092B4C'             --splashBackgroundColor '#092B4C'             --splashBackgroundColorDark '#092B4C'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify native camera bridge
        run: |
          set -e
          test -f android/app/src/main/java/com/martmartai/inventory/ScanMeCameraPlugin.java
          test -f android/app/src/main/java/com/martmartai/inventory/MainActivity.java
          grep -q 'registerPlugin(ScanMeCameraPlugin.class)' android/app/src/main/java/com/martmartai/inventory/MainActivity.java
          grep -q 'androidx.camera:camera-core:1.4.1' android/app/build.gradle
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q '@CapacitorPlugin(name="ScanMeCamera"' android/app/src/main/java/com/martmartai/inventory/ScanMeCameraPlugin.java

      - name: Verify live web sync configuration
        run: |
          grep -n "scanme-ai.vercel.app" capacitor.config.ts

      - name: Verify Android toolchain
        working-directory: ./android
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scanme-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk             --title "ScanMe AI Android ${TAG}"             --notes "ScanMe AI Android APK. Install on Android devices with APK installation enabled."             --latest
