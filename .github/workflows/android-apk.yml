name: Build Android Debug APK

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
      - scanme-ai-android-ux
  pull_request:
    branches:
      - main
      - master
      - scanme-ai-android-ux
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK packages
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Create fresh Capacitor Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Generate Android app icon and splash assets
        run: |
          npx @capacitor/assets generate --android --assetPath assets \
            --iconBackgroundColor '#092B4C' \
            --iconBackgroundColorDark '#092B4C' \
            --splashBackgroundColor '#092B4C' \
            --splashBackgroundColorDark '#092B4C'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify live web sync configuration
        run: |
          grep -n "scanme-ai.vercel.app" capacitor.config.ts

      - name: Verify Android toolchain
        working-directory: ./android
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scanme-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk \
            --title "ScanMe AI Android ${TAG}" \
            --notes "ScanMe AI Android APK. Install on Android devices with APK installation enabled." \
            --latest
